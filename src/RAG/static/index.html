<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&D RAG</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; background:#0d1117; color:#c9d1d9;
         font:15px/1.55 ui-sans-serif, system-ui, sans-serif; }
  main { max-width:820px; margin:auto; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:20px; }
  textarea { width:100%; box-sizing:border-box; padding:10px; resize:vertical;
             background:#161b22; color:#c9d1d9; border:1px solid #30363d;
             border-radius:6px; font:inherit; }
  textarea:focus-visible { outline:2px solid #58a6ff; outline-offset:1px; }
  .row { display:flex; gap:8px; align-items:center; margin:10px 0 20px;
         flex-wrap:wrap; }
  button { padding:8px 16px; border-radius:6px; border:1px solid #30363d;
           background:#238636; color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:#21262d; color:#c9d1d9; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible { outline:2px solid #58a6ff; outline-offset:1px; }

  /* Web search is a state, not an action: reads as a switch, not a button */
  .sep { width:1px; align-self:stretch; min-height:22px; background:#30363d;
         margin:0 2px; }
  .toggle { display:inline-flex; align-items:center; gap:8px;
            padding:6px 10px 6px 8px; background:none; border-radius:6px;
            border:1px solid transparent; color:#8b949e; font-size:14px; }
  .toggle:hover { background:#161b22; border-color:#30363d; color:#c9d1d9; }
  .toggle[aria-checked="true"] { color:#e6edf3; }
  .track { flex:none; box-sizing:border-box; width:28px; height:16px; padding:1px;
           border-radius:8px; background:#30363d; border:1px solid #3d444d;
           display:flex; align-items:center; }
  .knob { width:12px; height:12px; border-radius:50%; background:#8b949e;
          transition:transform .15s ease, background .15s ease; }
  .toggle[aria-checked="true"] .track { background:#1f6feb; border-color:#388bfd; }
  .toggle[aria-checked="true"] .knob { background:#fff; transform:translateX(12px); }
  @media (prefers-reduced-motion: reduce) { .knob { transition:none } }
  #sid { color:#8b949e; font-size:12px; font-family:ui-monospace, monospace;
         margin-left:auto; }
  kbd { font-family:ui-monospace, monospace; font-size:11px; padding:1px 5px;
        border:1px solid #30363d; border-radius:4px; background:#161b22; }

  /* ---- exchange log: most recent at top ---- */
  #log:empty::after { content:"No questions yet."; color:#8b949e;
        font-size:13px; }
  .ex { background:#161b22; border:1px solid #30363d; border-radius:6px;
        padding:14px; margin-bottom:16px; }
  .ex.pending { border-color:#9e6a03; }
  .q { color:#e6edf3; font-weight:600; border-left:3px solid #3fb950;
       padding-left:10px; margin-bottom:8px; white-space:pre-wrap; }
  .ex.web .q { border-left-color:#58a6ff; }
  .meta { font-family:ui-monospace, monospace; font-size:11.5px; color:#8b949e;
          margin-bottom:12px; }
  .ex.pending .meta { color:#d29922; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
         background:#d29922; margin-right:6px; vertical-align:1px;
         animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; opacity:.8 } }
  .divider { color:#8b949e; font-size:11.5px; font-family:ui-monospace, monospace;
             text-align:center; margin:0 0 16px; }

  details.tr { margin-top:12px; border-top:1px solid #30363d; padding-top:10px; }
  details.tr summary { cursor:pointer; font-size:12px; text-transform:uppercase;
        letter-spacing:.06em; color:#8b949e; }
  details.tr summary:focus-visible { outline:2px solid #58a6ff; }
  details.tr > div { margin-top:10px; }

  /* ---- markdown rendered inside .a ---- */
  .a > :first-child { margin-top:0; }
  .a > :last-child { margin-bottom:0; }
  .a h1, .a h2, .a h3, .a h4 {
      margin:18px 0 8px; line-height:1.3; font-weight:600; }
  .a h1 { font-size:17px; }
  .a h2 { font-size:16px; }
  .a h3, .a h4 { font-size:14.5px; color:#e6edf3; }
  .a p { margin:0 0 10px; }
  .a ul, .a ol { margin:0 0 10px; padding-left:22px; }
  .a li { margin:3px 0; }
  .a li > p { margin:0; }
  .a strong { color:#e6edf3; font-weight:600; }
  .a hr { border:0; border-top:1px solid #30363d; margin:16px 0; }
  .a blockquote { margin:0 0 10px; padding:2px 0 2px 12px;
      border-left:3px solid #30363d; color:#8b949e; }
  .a code { font-family:ui-monospace, monospace; font-size:13px;
      background:#0d1117; border:1px solid #30363d; border-radius:4px;
      padding:1px 5px; }
  .a pre { background:#0d1117; border:1px solid #30363d; border-radius:6px;
      padding:10px; overflow-x:auto; margin:0 0 10px; }
  .a pre code { background:none; border:0; padding:0; }
  .a table { border-collapse:collapse; margin:0 0 12px; font-size:14px;
      display:block; overflow-x:auto; }
  .a th, .a td { border:1px solid #30363d; padding:5px 10px; text-align:left; }
  .a th { background:#21262d; font-weight:600; color:#e6edf3; }
  .a a { color:#58a6ff; }

  .tc { font-family:ui-monospace, monospace; font-size:12.5px;
        border-left:2px solid #30363d; padding:2px 0 2px 10px; margin-bottom:8px; }
  .tc.call { border-color:#3fb950; }
  .tc.res  { border-color:#58a6ff; color:#8b949e; }
  .tc pre { margin:4px 0 0; white-space:pre-wrap; color:#8b949e; }
  .err { color:#f85149; }
</style>
<main>
  <h1>D&D rules agent</h1>
  <div class="sub">
    POST /chat &mdash; history is per session &middot;
    <kbd>Enter</kbd> to send &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line
  </div>

  <textarea id="q" rows="3"
    placeholder="rapier hits with 14 strength to kill an owlbear"></textarea>
  <div class="row">
    <button id="send">Send</button>
    <button id="reset" class="ghost">New session</button>
    <button id="clear" class="ghost">Clear log</button>
    <span class="sep"></span>
    <button id="web" class="toggle" type="button" role="switch" aria-checked="false"
            title="Fall back to a web search when the local rules don't answer">
      <span class="track"><span class="knob"></span></span>Web search</button>
    <span id="sid">no session</span>
  </div>

  <div id="log"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const log = $('log');
let sessionId = null;
let webEnabled = false;

const mdReady = typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
if (mdReady) marked.setOptions({ gfm: true, breaks: true });

const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function renderAnswer(el, text) {
  if (!mdReady) {
    el.innerHTML = `<pre style="white-space:pre-wrap">${esc(text)}</pre>`;
    return;
  }
  el.innerHTML = DOMPurify.sanitize(marked.parse(text), {
    ALLOWED_URI_REGEXP: /^(?:https?|mailto):/i
  });
}

function renderTrace(trace) {
  if (!trace.length) return '<span class="err">no tool calls — answer from model memory</span>';
  return trace.map(t => t.kind === 'call'
    ? `<div class="tc call">→ ${esc(t.name)}<pre>${esc(JSON.stringify(t.args, null, 2))}</pre></div>`
    : `<div class="tc res">← ${esc(t.name)} (${t.chars} char)<pre>${esc(t.preview)}</pre></div>`
  ).join('');
}

/* Creates the block in pending state and returns handles to complete it. */
function openExchange(query, web) {
  const ex = document.createElement('article');
  ex.className = 'ex pending' + (web ? ' web' : '');
  ex.innerHTML = `<div class="q"></div>
                  <div class="meta"><span class="dot"></span><span class="t">thinking… 0.0s</span></div>
                  <div class="a"></div>`;
  ex.querySelector('.q').textContent = query;
  log.prepend(ex);                       // most recent on top

  const t0 = performance.now();
  const tEl = ex.querySelector('.t');
  const tick = setInterval(() => {
    tEl.textContent = `thinking… ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  }, 100);

  return {
    elapsed: () => (performance.now() - t0) / 1000,
    finish(seconds, note) {
      clearInterval(tick);
      ex.classList.remove('pending');
      ex.querySelector('.meta').innerHTML =
        `${seconds.toFixed(1)}s${note ? ' · ' + esc(note) : ''}`;
    },
    answerEl: ex.querySelector('.a'),
    ex,
  };
}

async function send() {
  const query = $('q').value.trim();
  if (!query) return;
  const web = webEnabled;                // fixed now: the toggle may change later
  $('q').value = '';                     // while the request is in flight
  $('send').disabled = true;

  const slot = openExchange(query, web);
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        query: query,
        web: web,
        session_id: sessionId
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
    const d = await r.json();

    sessionId = d.session_id;
    $('sid').textContent = sessionId.slice(0, 8);

    const calls = d.trace.filter(t => t.kind === 'call').length;
    slot.finish(slot.elapsed(), `${calls} tool call${web ? ' · web' : ''}`);
    renderAnswer(slot.answerEl, d.answer);

    const tr = document.createElement('details');
    tr.className = 'tr';
    tr.innerHTML = `<summary>Trace</summary><div>${renderTrace(d.trace)}</div>`;
    if (!calls) tr.open = true;           // auto-open if no tool was called
    slot.ex.append(tr);
  } catch (e) {
    slot.finish(slot.elapsed(), 'error');
    slot.answerEl.innerHTML = `<span class="err">${esc(e)}</span>`;
    $('q').value = query;                 // restore the failed query
  } finally {
    $('send').disabled = false;
    $('q').focus();
  }
}

$('send').onclick = send;

$('web').onclick = () => {
  webEnabled = !webEnabled;
  $('web').setAttribute('aria-checked', String(webEnabled));
  $('q').focus();
};

$('reset').onclick = () => {
  sessionId = null;
  $('sid').textContent = 'no session';
  if (log.firstChild) {
    const d = document.createElement('div');
    d.className = 'divider';
    d.textContent = '— new session —';
    log.prepend(d);
  }
  $('q').focus();
};

$('clear').onclick = () => {
  log.replaceChildren();
  $('q').focus();
};

$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.shiftKey || e.isComposing) return;   // new line / IME composition
  e.preventDefault();                        // prevent leftover newline
  send();
});

$('q').focus();
</script>
